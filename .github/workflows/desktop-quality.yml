name: Desktop Package Quality
on:
  pull_request:
    paths:
      - "ConvexPress-Admin/**"
      - "ConvexPress-Website/**"
      - "blocks/**"
      - "scripts/blocks/**"
      - "scripts/admin/**"
      - "scripts/shared/**"
      - ".github/workflows/desktop-quality.yml"
  push:
    branches: [main, master]
    paths:
      - "ConvexPress-Admin/**"
      - "ConvexPress-Website/**"
      - "blocks/**"
      - "scripts/blocks/**"
      - "scripts/admin/**"
      - "scripts/shared/**"
      - ".github/workflows/desktop-quality.yml"
jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ConvexPress-Admin
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ConvexPress-Admin/.bun-version
      - name: Install frozen workspace
        run: bun install --frozen-lockfile
      - name: Check control-plane bindings
        run: bun run check:control-bindings
      - name: Generate backend extensions
        working-directory: ConvexPress-Admin/packages/backend
        run: bun run codegen:extensions
      - name: Verify desktop types
        working-directory: ConvexPress-Admin/packages/desktop
        run: |
          bunx tsc --noEmit -p tsconfig.electron.json
          bunx tsc --noEmit -p tsconfig.preload.json
      - name: Desktop and provisioning tool regressions
        run: bun run test:desktop
      - name: Build desktop application
        working-directory: ConvexPress-Admin/packages/desktop
        run: bun run build
      - name: Package native application and verify embedded provisioning
        working-directory: ConvexPress-Admin/packages/desktop
        run: node scripts/package-native.mjs ${{ matrix.target }} --dir --publish never
